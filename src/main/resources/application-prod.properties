spring.application.name=minions-car-sim
server.port=8081

# ---------------------------------------------------------------
# Virtual minions
# ---------------------------------------------------------------
# Number of minions to create
minions.count=1
# Start all minions automatically when the application is ready
minions.auto-start=true
# IMEI for generated minions = prefix + zero-padded index (15 digits total)
minions.imei-prefix=35693803
# Repeat the message list forever (true) or send it once and finish (false)
minions.loop=false
# TCP timeouts (ms)
minions.connect-timeout-ms=2000

# Defaults applied to every minion
minions.defaults.host=54.195.32.35
minions.defaults.port=8000
minions.defaults.wait-time-ms=10000
# minions.defaults.foxCommandsFilePath=/Users/carlospatino/development/code/techautogit/tech-auto-minions-car-simulator/src/main/resources/athlone-surroundings-fox.gprmc
minions.defaults.messages[0]=$<352254060256000 ignition off voltage='11.988' rpm='225' fuel='34' odo='91826000' total_engine_hours='4038'>*5c\n$GPRMC,165217.000,A,5325.3999,N,00756.0932,W,,,070926,,,*36\n$<end>
# minions.defaults.messages[1]=$<352254060256000 Position Voltage='13.753' RPM='1268' Fuel='35' Odo='91823000' Total_Engine_Hours='4036'>*69\n$GPRMC,165223.000,A,5325.5195,N,00756.0906,W,,,070926,,,*34\n$<end>
# minions.defaults.messages[2]=$<352254060256000 Position Voltage='13.753' RPM='1268' Fuel='35' Odo='91823000' Total_Engine_Hours='4036'>*69\n$GPRMC,165226.000,A,5325.6622,N,00755.9361,W,,,070926,,,*38\n$<end>
# minions.defaults.messages[3]=$<352254060256000 Position Voltage='13.753' RPM='1268' Fuel='35' Odo='91823000' Total_Engine_Hours='4036'>*69\n$GPRMC,165229.000,A,5325.7635,N,00755.7713,W,,,070926,,,*3F\n$<end>
# minions.defaults.messages[1]=$<352254060256000 Position Voltage='13.753' RPM='1268' Fuel='35' Odo='91823000' Total_Engine_Hours='4036'>*69\n$GPRMC,165223.000,A,5325.5195,N,00756.0906,W,,,070926,,,*34\n$<end>

# Optional per-minion overrides (by index, 0-based). Unset fields fall back to defaults.
minions.instances[0].imei=352254060256000
minions.instances[0].wait-time-ms=3000
