spring.application.name=minions-car-sim
server.port=8081

# ---------------------------------------------------------------
# Virtual minions
# ---------------------------------------------------------------
# Number of minions to create
minions.count=3
# Start all minions automatically when the application is ready
minions.auto-start=true
# IMEI for generated minions = prefix + zero-padded index (15 digits total)
minions.imei-prefix=35693803
# Repeat the message list forever (true) or send it once and finish (false)
minions.loop=false
# TCP timeouts (ms)
minions.connect-timeout-ms=5000

# Defaults applied to every minion
minions.defaults.host=localhost
minions.defaults.port=8000
minions.defaults.wait-time-ms=2000
# POSITION has to update
minions.defaults.messages[0]=$<MSG.Info.ServerLogin>\n$DeviceName=TECHAUTO-FOX3\n$Security=0\n$Software=avl_3.1.0 (IRNGT1gzLTRHIHJldjoxMy1OVUNIAhEA)\n$Hardware=FOX3-4G rev:13-NUCH\n$LastValidPosition=$GPRMC,100905.000,A,5325.6730,N,00756.1094,W,0.03,169.86,080225,,\n$IMEI={imei}\n$LocalIP=10.236.242.149\n$CmdVersion=2\n$SUCCESS\n$<end>
#  Change values and location
minions.defaults.messages[1]=$<{imei} Ignition On Voltage='11.988' RPM='225' Fuel='34' Odo='91826000' Total_Engine_Hours='4038'>*5C\n$GPRMC,222129.000,A,5316.7606,N,00730.0668,W,0.00,138.85,280519,,*13\n$<end>
minions.defaults.messages[2]=$<{imei} Trip Start Voltage='11.782' RPM='225' Fuel='34' Odo='91826000' Total_Engine_Hours='4038'>*33\n$GPRMC,222131.000,A,5316.7606,N,00730.0670,W,0.42,138.85,280519,,*15\n$<end>
#  Position and trip distance will have to be replaced with real coordinates
minions.defaults.messages[3]=$<{imei} Trip Distance='24037' Voltage='12.809' RPM='251' Fuel='23' Odo='91923000' Total_Engine_Hours='&(ERR)'>*3C\n$GPRMC,115331.000,A,5325.8119,N,00733.8292,W,0.21,329.13,060619,,*12\n$<end>
minions.defaults.messages[4]=$<{imei} Position Voltage='13.753' RPM='1268' Fuel='35' Odo='91823000' Total_Engine_Hours='4036'>*69\n$GPRMC,220055.000,A,5316.6249,N,00728.6809,W,14.34,354.45,280519,,*25\n$<end>
minions.defaults.messages[5]=$<{imei} Position>*2E\n$GPRMC,121705.000,A,5325.6510,N,00756.1147,W,5.90,339.21,010225,,*17\n$<end>
# Extra events to check events
minions.defaults.messages[6]=$<{imei} Power Failure Voltage='7.841' RPM='n/a' Fuel='n/a' Odo='n/a' Total_Engine_Hours='n/a'>*5D\n$GPRMC,080026.000,A,5325.8138,N,00733.8234,W,0.01,331.56,270619,,*1C\n$<end>
minions.defaults.messages[7]=$<{imei} Power Restored Voltage='8.129' RPM='n/a' Fuel='n/a' Odo='n/a' Total_Engine_Hours='n/a'>*39\n$GPRMC,080023.000,A,5325.8137,N,00733.8236,W,0.01,331.56,270619,,*14\n$<end>
minions.defaults.messages[8]=$<{imei} Ignition Off Voltage='13.876' RPM='801' Fuel='34' Odo='91826000' Total_Engine_Hours='4038'>*3C\n$GPRMC,220535.000,A,5316.7613,N,00730.0670,W,0.11,138.85,280519,,*15\n$<end>



# Optional per-minion overrides (by index, 0-based). Unset fields fall back to defaults.
minions.instances[0].imei=356938035643809
minions.instances[0].wait-time-ms=1000
#minions.instances[1].host=127.0.0.1
#minions.instances[1].port=9001
#minions.instances[1].messages[0]=CUSTOM message

# ---------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
